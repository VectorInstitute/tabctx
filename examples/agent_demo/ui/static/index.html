<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask your data · tabctx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/answer.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Ask your data</span>
      <span class="brand-sub" id="org"></span>
    </div>
    <div class="top-right">
      <button class="text-btn" id="settings-btn" type="button" aria-haspopup="dialog" aria-controls="settings" aria-expanded="false">
        <span id="agent-name">Agent</span>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <label class="switch" title="Every command and tool call behind the answer">
        <input type="checkbox" id="work-toggle" />
        <span class="track"><span class="knob"></span></span>
        <span class="switch-label">Show the work</span>
      </label>
      <button class="text-btn icon" id="theme" type="button" aria-label="Switch light or dark theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <!-- Who runs the agent (and, hosted, the visitor's key). -->
  <div class="popover" id="settings" role="dialog" aria-label="Agent settings" hidden>
    <section class="account" id="account" hidden aria-labelledby="h-account">
      <div class="panel-head">
        <h2 id="h-account">Gateway key</h2>
        <span class="info" tabindex="0" aria-label="About your key" data-tip="The agent's model calls are billed to your project; tabular calls are free.<br>Your key stays in server memory for this session only.">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </span>
      </div>
      <form id="login" autocomplete="off">
        <input id="key" type="password" placeholder="vp_…" spellcheck="false" autocomplete="off" aria-labelledby="h-account" />
        <button class="btn primary" type="submit">Sign in</button>
      </form>
      <div class="signed" hidden>
        <span class="dot"></span><span id="key-id" class="mono"></span>
        <button class="link" id="logout" type="button">Sign out</button>
      </div>
    </section>
    <section aria-labelledby="h-agent">
      <h2 id="h-agent">Agent</h2>
      <div id="agents" class="agents" role="radiogroup" aria-labelledby="h-agent"></div>
    </section>
    <section aria-labelledby="h-gateway">
      <h2 id="h-gateway">Models</h2>
      <span class="gateway" id="gateway"></span>
    </section>
  </div>

  <main class="layout" id="layout">
    <!-- The brief: what a business reader sees. -->
    <section class="convo" id="convo" aria-live="polite">
      <div class="hero" id="empty">
        <div class="files" id="attachments"></div>
        <p class="question" id="question"></p>
        <div class="hero-actions">
          <button id="run" class="btn primary" type="button"><span id="run-label">Ask</span></button>
          <button id="replay" class="link-btn" type="button" disabled>or watch a recorded run</button>
        </div>
        <p id="notice" class="notice" role="alert" hidden></p>
      </div>

      <div class="thread" id="thread" hidden>
        <header class="brief">
          <p class="question" id="you-text"></p>
          <p class="files-line" id="you-files"></p>
        </header>
        <div id="answer"></div>
        <div class="again" id="again" hidden>
          <button class="link-btn" id="again-replay" type="button">Watch again</button>
          <span class="sep">·</span>
          <button class="link-btn" id="again-new" type="button">Back to the question</button>
        </div>
      </div>
    </section>

    <!-- The work: every command and tool call, for whoever wants to check. -->
    <aside class="work" id="work" aria-label="The agent's work">
      <div class="run-head">
        <div>
          <div class="run-title" id="run-title">The agent's work</div>
          <div class="run-meta" id="run-meta"></div>
        </div>
        <div class="status" id="status" role="status"></div>
      </div>
      <details class="prompt-box" id="prompt-box">
        <summary>The agent's full instructions</summary>
        <textarea id="prompt" spellcheck="false" rows="10" aria-label="The agent's instructions"></textarea>
        <button class="link" id="reset-prompt" type="button">Reset</button>
      </details>
      <div class="steps" id="steps" aria-label="Progress"></div>
      <div class="timeline" id="timeline"><p class="faint">Ask the question, or watch a recorded run, to see each step the agent takes.</p></div>
      <div class="outcome" id="outcome" hidden>
        <h3 class="section-title">Scored on real outcomes</h3>
        <div class="scores" id="scores"></div>
        <details class="report-card" id="report-card">
          <summary>
            report.md
            <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <article class="report" id="report"></article>
        </details>
      </div>
    </aside>
  </main>

  <div class="tip" id="tip" role="tooltip"></div>
  <script src="/static/answer.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
