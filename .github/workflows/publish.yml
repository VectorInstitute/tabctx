# Publish tabctx to PyPI + create a GitHub Release on a version tag
# (e.g. `git tag v0.9.0 && git push --tags`). Modeled on motive's
# publish workflow (uv build, PyPI Trusted Publishing via OIDC -- no API
# token stored in GitHub, `pypi` environment as the release gate).
#
# ONE-TIME SETUP before the first release:
#   1. PyPI -> project (or pending publisher) -> Publishing -> add a
#      trusted publisher: owner=VectorInstitute, repo=tabctx,
#      workflow=publish.yml, environment=pypi.
#   2. GitHub repo -> Settings -> Environments -> create "pypi"
#      (optionally with required reviewers as a release gate).
name: publish package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing
      contents: write  # GitHub Release creation
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION != pyproject version $PYPROJECT_VERSION" >&2
            exit 1
          fi

      - name: Run unit tests
        run: |
          uv venv && uv pip install -e ".[dev]"
          uv run pytest tests/unit/ -q

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/*"
          generateReleaseNotes: true
          allowUpdates: true
