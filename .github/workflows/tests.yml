name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tabctx (dev extras)
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v

  # Separate job: needs ray[serve] (heavy install) and boots a local
  # 2-replica Ray Serve cluster to prove multi-replica session affinity
  # end to end (the v0.6.0 correctness fix). Unit tests stay fast and
  # dependency-light in the job above.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tabctx (serve + dev extras)
        run: pip install -e ".[serve,dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -v
