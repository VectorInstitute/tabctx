# Publish tabctx to PyPI on a version tag (e.g. `git tag v0.8.0 && git push --tags`).
#
# Uses PyPI Trusted Publishing (OIDC) -- no API token stored in GitHub.
# ONE-TIME SETUP required before the first release (a human step):
#   1. Create the project on PyPI (or reserve the name).
#   2. PyPI -> project -> Publishing -> add a "trusted publisher":
#      owner=VectorInstitute, repo=tabctx, workflow=release.yml,
#      environment=pypi.
#   3. GitHub repo -> Settings -> Environments -> create "pypi"
#      (optionally with required reviewers as a release gate).
# Until that setup exists, this workflow simply fails at the publish
# step and nothing is released.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION != pyproject version $PYPROJECT_VERSION" >&2
            exit 1
          fi

      - name: Run unit tests
        run: |
          pip install -e ".[dev]"
          pytest tests/unit/ -q

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
