[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabctx"
version = "0.8.0"
description = "Multi-tenant context caching and serving for tabular in-context-learning foundation models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Vector Institute" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/VectorInstitute/tabctx"
Changelog = "https://github.com/VectorInstitute/tabctx/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/VectorInstitute/tabctx/blob/main/ROADMAP.md"

[project.optional-dependencies]
tabicl = ["tabicl", "torch"]
# TabPFN v8+ weights are license-gated by PriorLabs: register at
# https://ux.priorlabs.ai, accept the license, export TABPFN_TOKEN.
tabpfn = ["tabpfn", "torch"]
# ray>=2.58 is required for the consistent-hash request router that makes
# multi-replica deployments correct (see serve/app.py and ROADMAP.md).
# jinja2 is imported unconditionally by ray.serve's haproxy module but
# missing from some ray[serve] distributions (seen on a clean CI install).
serve = ["ray[serve]>=2.58.0", "fastapi", "uvicorn[standard]", "jinja2"]
dev = ["pytest>=7.0", "httpx"]

[dependency-groups]
# uv-managed dev environment (CI uses `uv sync --dev`); the [dev] extra
# below stays for plain-pip users.
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "httpx",
    "pre-commit",
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # long lines: docstrings/comments carry measured numbers and URLs
    "SIM105",  # contextlib.suppress reads worse than try/except here
    "B008",    # FastAPI Depends-style call defaults
]

[tool.ruff.lint.per-file-ignores]
# Probes/benchmarks favor top-of-file constants and prints over structure.
"benchmarks/*" = ["E402"]
"tests/*" = ["E402"]  # importorskip before imports is the pytest idiom

[tool.hatch.build.targets.wheel]
packages = ["src/tabctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
