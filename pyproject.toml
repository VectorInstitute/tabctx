[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabctx"
version = "0.1.0"
description = "Multi-tenant context caching and serving for tabular in-context-learning foundation models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
tabicl = ["tabicl", "torch"]
serve = ["ray[serve]", "fastapi", "uvicorn[standard]"]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tabctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
