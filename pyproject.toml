[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabctx"
version = "0.7.0"
description = "Multi-tenant context caching and serving for tabular in-context-learning foundation models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Vector Institute" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/VectorInstitute/tabctx"
Changelog = "https://github.com/VectorInstitute/tabctx/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/VectorInstitute/tabctx/blob/main/ROADMAP.md"

[project.optional-dependencies]
tabicl = ["tabicl", "torch"]
# ray>=2.58 is required for the consistent-hash request router that makes
# multi-replica deployments correct (see serve/app.py and ROADMAP.md).
serve = ["ray[serve]>=2.58.0", "fastapi", "uvicorn[standard]"]
dev = ["pytest>=7.0", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/tabctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
