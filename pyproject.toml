[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabctx"
version = "0.17.0"
description = "Serving engine for tabular foundation models (TabICL, TabPFN): fit a table once, keep its encoded context on the GPU, and serve fast repeat predictions to many tenants, with memory-aware admission and multi-GPU placement."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Vector Institute" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
tabctx-mcp = "tabctx.mcp_tools.cli:main"

[project.urls]
Repository = "https://github.com/VectorInstitute/tabctx"
Changelog = "https://github.com/VectorInstitute/tabctx/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/VectorInstitute/tabctx/blob/main/ROADMAP.md"

[project.optional-dependencies]
tabicl = ["tabicl>=2.2.0", "torch"]
# TabPFN v8+ weights are license-gated by PriorLabs: register at
# https://ux.priorlabs.ai, accept the license, export TABPFN_TOKEN.
tabpfn = ["tabpfn", "torch"]
# ray>=2.58 is required for the consistent-hash request router that makes
# multi-replica deployments correct (see serve/app.py and ROADMAP.md).
# jinja2 is imported unconditionally by ray.serve's haproxy module but
# missing from some ray[serve] distributions (seen on a clean CI install).
serve = [
    "ray[serve]>=2.58.0",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pyarrow>=14",
    "python-multipart>=0.0.9",
    # the agent demo's web app (examples/agent_demo/ui), in the unit tests
    "fastapi",
]
# The Ray-free standalone host (`python -m tabctx.serve`, see
# serve/standalone.py): [serve] minus ray. Single replica only -- the
# consistent-hash session-affinity router is Ray's.
standalone = [
    "fastapi",
    "uvicorn[standard]",
    "pyarrow>=14",
    "python-multipart>=0.0.9",
]
# The scikit-learn-style estimators (tabctx.estimators); pyarrow sends
# tables as Parquet (without it, gzip CSV).
client = ["scikit-learn>=1.6", "pyarrow>=14"]
# tabctx-mcp: the models as tools for coding agents (MCP server and CLI).
mcp = ["tabctx[client]", "pandas>=2.0", "mcp>=2.3"]
dev = ["pytest>=7.0", "pytest-cov", "httpx"]

[dependency-groups]
# uv-managed dev environment (CI uses `uv sync --dev`); the [dev] extra
# below stays for plain-pip users.
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "httpx",
    "pre-commit",
    "ruff",
    "pyarrow>=14",
    "python-multipart>=0.0.9",
    # The standalone host's unit tests exercise the full HTTP service
    # in-process (no server, no ray) via httpx's ASGI transport.
    "fastapi",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# ruff >= 0.14 also formats fenced code in Markdown; README snippets are
# hand-aligned for reading, not for the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # long lines: docstrings/comments carry measured numbers and URLs
    "SIM105",  # contextlib.suppress reads worse than try/except here
    "B008",    # FastAPI Depends-style call defaults
]

[tool.ruff.lint.per-file-ignores]
# Probes/benchmarks favor top-of-file constants and prints over structure.
"benchmarks/*" = ["E402"]
"tests/*" = ["E402"]  # importorskip before imports is the pytest idiom

[tool.hatch.build.targets.wheel]
packages = ["src/tabctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# tabicl/tabpfn need a real GPU or PriorLabs-licensed weights and are
# never installed by any CI job (unit_tests.yml runs `uv sync --dev`;
# integration_tests.yml installs `.[serve,dev]` -- neither pulls in
# tabicl, tabpfn, or torch). They're tested locally/on GPU rigs instead
# (see tests/integration/test_tabpfn_backend.py's docstring). Measuring
# coverage on code that structurally cannot run in CI would just be a
# permanent, meaningless 0% rather than a signal -- omitted here for
# the same reason.
omit = [
    "src/tabctx/backends/tabicl.py",
    "src/tabctx/backends/tabpfn.py",
]
