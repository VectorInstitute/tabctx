{{- if and (has "tabpfn" .Values.models) (not (include "tabctx.tabpfnSecret" .)) (not .Values.tabpfnWithoutToken) }}
{{- fail "models includes tabpfn: set existingTabpfnSecret or tabpfnToken (TabPFN's weights need a Prior Labs token), or tabpfnWithoutToken if they are already in the weights volume" }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (or .Values.spill.enabled .Values.weightsCache.enabled) }}
{{- fail "replicaCount > 1 can't share the chart's ReadWriteOnce volumes, and a context lives in one pod: keep replicaCount 1 (give the pod more GPUs for capacity)" }}
{{- end }}
{{- range $name, $volume := dict "spill" .Values.spill "weightsCache" .Values.weightsCache }}
{{- if and $volume.enabled (not $volume.existingClaim) (lt (int $volume.sizeGi) 1) }}
{{- fail (printf "%s.sizeGi must be a whole number of GiB, at least 1" $name) }}
{{- end }}
{{- end }}
{{- $extraNames := list }}
{{- range .Values.extraEnv }}{{ $extraNames = append $extraNames .name }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tabctx.fullname" . }}
  labels:
    {{- include "tabctx.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # A GPU and ReadWriteOnce volumes: the old pod goes before the new starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tabctx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tabctx.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # No Service environment variables: a release named "tabctx" would
      # inject TABCTX_PORT and friends into tabctx's own settings namespace.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tabctx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $name, $value := (include "tabctx.env" . | fromYaml) }}
            {{- if not (has $name $extraNames) }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- end }}
            {{- with (include "tabctx.tabpfnSecret" .) }}
            {{- if not (has "TABPFN_TOKEN" $extraNames) }}
            - name: TABPFN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: TABPFN_TOKEN
            {{- end }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              {{- if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ .value | toString | quote }}
              {{- end }}
            {{- end }}
          # Starting loads each model's weights (the first time, downloads
          # them) and compiles kernels before the server answers. Then
          # /livez fails only on what a restart fixes (a dead GPU worker);
          # /readyz also on transient pressure.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: {{ max 1 (div (int .Values.startupSeconds) 10) }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources:
            {{- $resources := deepCopy (.Values.resources | default dict) }}
            {{- if gt (int .Values.gpus) 0 }}
            {{- $limits := default (dict) $resources.limits }}
            {{- $_ := set $limits "nvidia.com/gpu" (int .Values.gpus) }}
            {{- $_ := set $resources "limits" $limits }}
            {{- end }}
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.spill.enabled }}
            - name: spill
              mountPath: /data/spill
            {{- end }}
            {{- if .Values.weightsCache.enabled }}
            - name: weights
              mountPath: /cache
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        # Uploaded tables (deleted once read) and large fits' staging.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        {{- if .Values.spill.enabled }}
        - name: spill
          persistentVolumeClaim:
            claimName: {{ include "tabctx.claim" (list . .Values.spill "spill") }}
        {{- end }}
        {{- if .Values.weightsCache.enabled }}
        - name: weights
          persistentVolumeClaim:
            claimName: {{ include "tabctx.claim" (list . .Values.weightsCache "weights") }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
