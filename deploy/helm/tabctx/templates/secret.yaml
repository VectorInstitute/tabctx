{{- if and .Values.tabpfnToken (not .Values.existingTabpfnSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tabctx.fullname" . }}-tabpfn
  labels:
    {{- include "tabctx.labels" . | nindent 4 }}
type: Opaque
stringData:
  TABPFN_TOKEN: {{ .Values.tabpfnToken | quote }}
{{- end }}
