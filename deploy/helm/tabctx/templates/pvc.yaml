{{- range $name, $volume := dict "spill" .Values.spill "weights" .Values.weightsCache }}
{{- if $volume.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tabctx.fullname" $ }}-{{ $name }}
  labels:
    {{- include "tabctx.labels" $ | nindent 4 }}
  annotations:
    # Kept on uninstall: spilled contexts and downloaded weights.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $volume.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ printf "%dGi" (int $volume.sizeGi) }}
{{- end }}
{{- end }}
